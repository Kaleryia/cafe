<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы — DOZA coffee</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="container header-container">
        <div class="logo">
            <span class="logo-icon">☕</span>
            <span class="logo-text">DOZA coffee</span>
        </div>
        <button class="burger" id="burgerBtn" aria-label="Меню">
            <span></span><span></span><span></span>
        </button>
        <nav class="nav" id="navMenu">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Главная</a></li>
                <li><a href="menu.html" class="nav-link">Меню</a></li>
                <li><a href="contacts.html" class="nav-link">Контакты</a></li>
                <li><a href="cart.html" class="nav-link">Корзина</a></li>
		<li><a href="about.html" class="nav-link">О нас</a></li>
		<li><a href="reviews.html" class="nav-link">Отзывы</a></li>
            </ul>
        </nav>
    </div>
</header>

<main>
    <div class="container breadcrumbs">
        <a href="index.html">Главная</a> <span>/</span> <span>Отзывы</span>
    </div>

    <section class="reviews-section">
        <div class="container">
            <h2 class="section-title">Отзывы наших гостей</h2>
		<div class="add-review-form" style="background:#FFF9F5; padding:20px; border-radius:24px; margin-bottom:40px;">
    <h3 style="color:#4E6851;">Оставьте свой отзыв</h3>
    <form id="newReviewForm">
        <input type="text" id="reviewName" placeholder="Ваше имя" required style="width:100%; padding:10px; margin:10px 0; border-radius:8px; border:1px solid #ddd;">
        <select id="reviewRating" required style="width:100%; padding:10px; margin:10px 0; border-radius:8px;">
            <option value="5">★★★★★ (5)</option>
            <option value="4">★★★★☆ (4)</option>
            <option value="3">★★★☆☆ (3)</option>
            <option value="2">★★☆☆☆ (2)</option>
            <option value="1">★☆☆☆☆ (1)</option>
        </select>
        <textarea id="reviewText" rows="4" placeholder="Ваш отзыв" required style="width:100%; padding:10px; margin:10px 0; border-radius:8px;"></textarea>
        <button type="submit" style="background:#4E6851; color:white; padding:10px 20px; border:none; border-radius:40px; cursor:pointer;">Отправить отзыв</button>
    </form>
</div>
            <div id="reviewsGrid" class="reviews-grid"></div>
        </div>
    </section>
</main>

<footer class="footer">
    <div class="container">
        <p>© 2026 «DOZA coffee» — Ваш уголок радости)</p>
    </div>
</footer>

<script src="script.js"></script>
<button id="scrollTopBtn" style="position:fixed; bottom:30px; right:30px; width:50px; height:50px; background:#4E6851; color:white; border:none; border-radius:50%; cursor:pointer; display:none; align-items:center; justify-content:center; font-size:24px; z-index:999;">↑</button>
</body>
</html>
